services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stardust
      POSTGRES_PASSWORD: stardust
      POSTGRES_DB: stardust
    ports:
      - "5433:5432"
    volumes:
      - stardust_pgdata:/var/lib/postgresql/data

volumes:
  stardust_pgdata:
